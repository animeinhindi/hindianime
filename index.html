<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeInHidi - Hindi Dubbed Anime</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff4b5c;
    }
    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .anime-card {
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 75, 92, 0.3);
      transition: transform 0.2s;
    }
    .anime-card:hover {
      transform: scale(1.03);
    }
    .anime-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }
    .anime-card h3 {
      font-size: 18px;
      margin: 10px;
    }
    .buttons {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
    }
    .btn {
      background-color: #ff4b5c;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #ff1c3d;
    }
  </style>
</head>
<body>
  <header>
    AnimeInHidi - Hindi Dubbed Anime
  </header>
  <div class="container">
    <!-- Sample Anime Card -->
    <div class="anime-card">
      <img src="C:\Users\maity\Downloads\HOLPM0837K-2024\animeinhindi\Naruto_poster.jpg" alt="Naruto" />
      <h3>Naruto (Hindi Dub)</h3>
      <div class="buttons">
        <a href="#" class="btn">Watch</a>
        <a href="#" class="btn">Download</a>
      </div>
    </div>

    <div class="anime-card">
      <img src="https://via.placeholder.com/300x240.png?text=Attack+on+Titan" alt="AOT" />
      <h3>Attack on Titan (Hindi Dub)</h3>
      <div class="buttons">
        <a href="#" class="btn">Watch</a>
        <a href="#" class="btn">Download</a>
      </div>
    </div>

    <!-- Add more cards here -->
  </div>
</body>
</html>
